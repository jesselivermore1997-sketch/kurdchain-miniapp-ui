<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KurdChain Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f3f4f6;
            color: #111827;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }
        .header-bg { background-color: #ffffff; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; }
        
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 15px; }
        .price-card { background-color: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px 5px; text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .card-val { font-size: 16px; font-weight: 700; color: #111827; margin-bottom: 4px; direction: ltr; }
        .card-name { font-size: 11px; color: #6b7280; display: flex; align-items: center; justify-content: center; gap: 4px; }
        .arrow-up { color: #10b981; font-size: 10px; }
        
        .list-container { background-color: #ffffff; border-radius: 12px; margin: 0 15px 15px 15px; overflow: hidden; border: 1px solid #e5e7eb; }
        .list-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 15px; border-bottom: 1px solid #e5e7eb; }
        .list-item:last-child { border-bottom: none; }

        .tab-btn { color: #6b7280; border-bottom: 2px solid transparent; transition: all 0.2s ease; padding-bottom: 8px; font-size: 14px; }
        .tab-btn.active { color: #2563eb; border-bottom: 2px solid #2563eb; font-weight: 600; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; border-top: 1px solid #e5e7eb; display: flex; justify-content: space-around; padding: 10px 0; z-index: 50; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #9ca3af; font-size: 11px; font-weight: 600; gap: 4px; cursor: pointer; }
        .nav-item.active { color: #2563eb; }
        .nav-icon { font-size: 20px; }

        .calc-box { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; display: flex; justify-content: space-between; align-items: center; margin: 0 15px; }
        .calc-box.result-box { background: #e6f0ff; border-color: #bfdbfe; }
        .asset-selector { display: flex; align-items: center; gap: 8px; background: #f3f4f6; padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .calc-input { font-size: 24px; font-weight: 700; background: transparent; border: none; outline: none; width: 60%; direction: ltr; text-align: left; }
        
        .keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px; margin-top: auto; }
        .key { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 12px; height: 56px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 500; cursor: pointer; }
        .key:active { background: #f3f4f6; }
        .key-action { background: #fee2e2; color: #ef4444; border-color: #fca5a5; }
        .key-swap { background: #dbeafe; color: #2563eb; border-color: #bfdbfe; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .bottom-sheet { position: absolute; bottom: -100%; left: 0; right: 0; background: #ffffff; border-radius: 20px 20px 0 0; padding: 20px; transition: bottom 0.3s; max-height: 80vh; overflow-y: auto; }
        .modal-overlay.active .bottom-sheet { bottom: 0; }
    </style>
</head>
<body>

    <div id="loading" class="flex h-screen items-center justify-center">
        <div class="text-center">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto mb-3"></div>
            <p class="text-sm text-gray-500">خەریکی سەلماندن و هێنانی نرخەکان...</p>
        </div>
    </div>

    <!-- داشبۆردی سەرەکی -->
    <div id="view-dashboard" class="hidden pb-20">
        <div class="header-bg sticky top-0 z-10">
            <div class="flex justify-between items-center px-4 py-3">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-blue-600 text-white rounded-lg flex items-center justify-center font-bold">K</div>
                    <h1 class="text-lg font-bold text-blue-600">KURDCHAIN</h1>
                </div>
                <div class="text-xs text-gray-500 flex flex-col items-end">
                    <span class="flex items-center gap-1 text-green-600 font-medium bg-green-50 px-2 py-0.5 rounded">
                        <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span> ڕاستەوخۆ
                    </span>
                    <span id="clock" class="mt-1">--:--</span>
                </div>
            </div>
            <div class="flex px-4 mt-2">
                <button onclick="switchTab('currencies')" id="tab-currencies" class="tab-btn active flex-1">دراوەکان</button>
                <button onclick="switchTab('metals')" id="tab-metals" class="tab-btn flex-1">زێڕ و زیوو</button>
                <button onclick="switchTab('crypto')" id="tab-crypto" class="tab-btn flex-1">کریپتۆ</button>
            </div>
        </div>

        <div id="content-currencies">
            <div class="grid-container" id="grid-cities"></div>
            <div class="list-container" id="list-other-currencies"></div>
        </div>
        
        <div id="content-metals" class="hidden">
            <div class="grid-container" id="grid-metals-top"></div>
            <div class="list-container" id="list-metals"></div>
        </div>
        
        <div id="content-crypto" class="hidden">
            <div class="list-container mt-4" id="list-crypto"></div>
        </div>
    </div>

    <!-- پەڕەی حاسیبە -->
    <div id="view-calculator" class="hidden pb-24 h-screen flex flex-col bg-gray-50">
        <div class="p-4 text-center font-bold text-gray-700 bg-white border-b">ئاڵوگۆڕ و حاسیبە</div>
        
        <div class="mt-6">
            <div class="calc-box">
                <input type="text" id="calc-input" class="calc-input text-gray-800" value="0" readonly>
                <div class="asset-selector" onclick="openAssetModal('from')">
                    <span id="from-icon">🇺🇸</span> <span id="from-name">USD</span> <span>▼</span>
                </div>
            </div>
            
            <div class="flex justify-center my-[-10px] z-10 relative">
                <div onclick="swapAssets()" class="bg-blue-100 text-blue-600 w-10 h-10 rounded-full flex items-center justify-center border-4 border-white cursor-pointer shadow-sm">⇅</div>
            </div>

            <div class="calc-box result-box">
                <input type="text" id="calc-output" class="calc-input text-blue-800" value="0" readonly>
                <div class="asset-selector bg-blue-200 text-blue-800" onclick="openAssetModal('to')">
                    <span id="to-icon">🇮🇶</span> <span id="to-name">IQD</span> <span>▼</span>
                </div>
            </div>
        </div>

        <!-- کیبۆرد -->
        <div class="keypad mt-auto">
            <div class="key" onclick="keyPress('7')">7</div>
            <div class="key" onclick="keyPress('8')">8</div>
            <div class="key" onclick="keyPress('9')">9</div>
            <div class="key key-action" onclick="keyPress('DEL')">⌫</div>
            <div class="key" onclick="keyPress('4')">4</div>
            <div class="key" onclick="keyPress('5')">5</div>
            <div class="key" onclick="keyPress('6')">6</div>
            <div class="key key-action" onclick="keyPress('C')">C</div>
            <div class="key" onclick="keyPress('1')">1</div>
            <div class="key" onclick="keyPress('2')">2</div>
            <div class="key" onclick="keyPress('3')">3</div>
            <div class="key" onclick="keyPress('.')">.</div>
            <div class="key" onclick="keyPress('0')">0</div>
            <div class="key" onclick="keyPress('00')">00</div>
            <div class="key" onclick="keyPress('000')">000</div>
            <div class="key key-swap" onclick="swapAssets()">⇅</div>
        </div>
    </div>

    <!-- مینیوی خوارەوە -->
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-dash" onclick="switchView('dashboard')">
            <span class="nav-icon">📈</span><span>نرخەکان</span>
        </div>
        <div class="nav-item" id="nav-calc" onclick="switchView('calculator')">
            <span class="nav-icon">💱</span><span>ئاڵوگۆڕ</span>
        </div>
    </div>

    <!-- Bottom Sheet -->
    <div class="modal-overlay" id="asset-modal" onclick="closeModal(event)">
        <div class="bottom-sheet" onclick="event.stopPropagation()">
            <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto mb-4"></div>
            <h3 class="text-center font-bold mb-4">هەڵبژاردنی دراو یان کانزا</h3>
            <div class="list-container mx-0" id="modal-asset-list"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // بەستەری دروستی سێرڤەرەکە
        const apiUrl = "https://kurdchain-miniapp-api-production.up.railway.app";
        let apiData = null;
        
        let calcVal = "0";
        let fromAsset = "usd";
        let toAsset = "iqd";
        let selectingFor = "from";

        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
        }, 1000);

        function switchView(view) {
            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('view-calculator').classList.add('hidden');
            document.getElementById('nav-dash').classList.remove('active');
            document.getElementById('nav-calc').classList.remove('active');
            
            document.getElementById(`view-${view}`).classList.remove('hidden');
            document.getElementById(view === 'dashboard' ? 'nav-dash' : 'nav-calc').classList.add('active');
        }

        function switchTab(tabName) {
            ['currencies', 'metals', 'crypto'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.remove('active');
                document.getElementById(`content-${t}`).classList.add('hidden');
            });
            document.getElementById(`tab-${tabName}`).classList.add('active');
            document.getElementById(`content-${tabName}`).classList.remove('hidden');
        }

        function generateGridCards(items) {
            if (!items) return '';
            return items.map(item => `
                <div class="price-card">
                    <div class="card-val">${item.price}</div>
                    <div class="card-name">
                        <span>${item.name}</span>
                        <span class="arrow-up">↑</span>
                    </div>
                </div>
            `).join('');
        }
        
        function generateListRows(items, sourceText = "") {
            if (!items) return '';
            let html = items.map(item => `
                <div class="list-item">
                    <div class="flex items-center gap-3">
                        <span class="text-xl">${item.icon}</span>
                        <div>
                            <div class="font-bold text-sm">${item.name}</div>
                            <div class="text-[10px] text-gray-500">${item.desc}</div>
                        </div>
                    </div>
                    <div class="font-bold text-[15px] direction-ltr">${item.price}</div>
                </div>
            `).join('');
            
            if (sourceText) {
                html += `<div class="p-3 text-center text-[10px] text-gray-400 bg-gray-50 border-t border-gray-100">${sourceText}</div>`;
            }
            return html;
        }

        // Calculator functions
        function keyPress(key) {
            if (key === 'C') calcVal = "0";
            else if (key === 'DEL') calcVal = calcVal.length > 1 ? calcVal.slice(0, -1) : "0";
            else if (key === '.') { if (!calcVal.includes('.')) calcVal += '.'; }
            else { calcVal = calcVal === "0" ? key : calcVal + key; }
            updateCalcDisplay();
        }

        function swapAssets() {
            const temp = fromAsset;
            fromAsset = toAsset;
            toAsset = temp;
            updateCalcUI();
        }

        function updateCalcUI() {
            if(!apiData || !apiData.calculator) return;
            const fromObj = apiData.calculator.find(a => a.id === fromAsset);
            const toObj = apiData.calculator.find(a => a.id === toAsset);
            
            if(fromObj && toObj) {
                document.getElementById('from-icon').innerText = fromObj.icon;
                document.getElementById('from-name').innerText = fromObj.id.toUpperCase().split('_')[0];
                document.getElementById('to-icon').innerText = toObj.icon;
                document.getElementById('to-name').innerText = toObj.id.toUpperCase().split('_')[0];
            }
            updateCalcDisplay();
        }

        function updateCalcDisplay() {
            document.getElementById('calc-input').value = formatNumber(calcVal);
            if(!apiData || !apiData.calculator) return;
            
            const fromObj = apiData.calculator.find(a => a.id === fromAsset);
            const toObj = apiData.calculator.find(a => a.id === toAsset);
            
            if(!fromObj || !toObj) return;

            const rawVal = parseFloat(calcVal) || 0;
            const valInUSD = rawVal * fromObj.rate_to_usd;
            const finalVal = valInUSD / toObj.rate_to_usd;
            
            document.getElementById('calc-output').value = formatNumber(finalVal.toFixed(4).replace(/\.?0+$/, ''));
        }

        function formatNumber(numStr) {
            const parts = numStr.toString().split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            return parts.join('.');
        }

        function openAssetModal(target) {
            if(!apiData || !apiData.calculator) return;
            selectingFor = target;
            const listHtml = apiData.calculator.map(item => `
                <div class="list-item cursor-pointer hover:bg-gray-50" onclick="selectAsset('${item.id}')">
                    <div class="flex items-center gap-3"><span class="text-xl">${item.icon}</span><span class="font-bold text-sm">${item.name}</span></div>
                </div>
            `).join('');
            document.getElementById('modal-asset-list').innerHTML = listHtml;
            document.getElementById('asset-modal').classList.add('active');
        }

        function closeModal(e) {
            if (e.target.id === 'asset-modal') document.getElementById('asset-modal').classList.remove('active');
        }

        function selectAsset(id) {
            if (selectingFor === 'from') fromAsset = id;
            else toAsset = id;
            document.getElementById('asset-modal').classList.remove('active');
            updateCalcUI();
        }

        async function fetchPrices() {
            try {
                const res = await fetch(`${apiUrl}/api/prices`);
                if (!res.ok) throw new Error("Network response was not ok");
                
                apiData = await res.json();
                
                if (apiData.dashboard) {
                    const dash = apiData.dashboard;
                    
                    document.getElementById('grid-cities').innerHTML = generateGridCards(dash.currencies.slice(0, 6));
                    document.getElementById('list-other-currencies').innerHTML = generateListRows(dash.currencies.slice(6), "سەرچاوە: کاک هاوکار • 07701570694");
                    
                    document.getElementById('grid-metals-top').innerHTML = generateGridCards(dash.metals.slice(1, 4));
                    document.getElementById('list-metals').innerHTML = generateListRows([dash.metals[0], ...dash.metals.slice(4)], "سەرچاوە: کاک کاردۆ • 07705045485");
                    
                    document.getElementById('list-crypto').innerHTML = generateListRows(dash.crypto, "KURDCHAIN TERMINAL");
                }

                updateCalcUI();

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('view-dashboard').classList.remove('hidden');

            } catch (error) {
                console.error("Failed to fetch prices:", error);
            }
        }

        async function initApp() {
            const user = tg.initDataUnsafe?.user;
            if (!user) {
                fetchPrices(); 
                return;
            }
            try {
                const verifyResponse = await fetch(`${apiUrl}/api/verify/${user.id}`);
                const verifyData = await verifyResponse.json();
                
                if (verifyData.is_vip) {
                    fetchPrices();
                    setInterval(fetchPrices, 10000); 
                } else {
                    document.body.innerHTML = `<div class="flex h-screen items-center justify-center text-center px-4"><div class="bg-white p-6 rounded-xl shadow-lg w-full"><h2 class="text-xl font-bold text-red-500 mb-2">ڕێگەپێنەدراو</h2><p class="text-gray-500 text-sm mb-4">پێویستە ئەندامی کەناڵی KurdChain بیت.</p><button onclick="tg.close()" class="bg-blue-600 text-white w-full py-3 rounded-lg font-semibold">داخستن</button></div></div>`;
                }
            } catch(e) {
                fetchPrices();
            }
        }

        initApp();
    </script>
</body>
</html>
