<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KurdChain Terminal</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .header-bg {
            background-color: #1c1c1e;
            border-bottom: 1px solid #2c2c2e;
        }
        .tab-btn {
            color: #8e8e93;
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            color: #0a84ff;
            border-bottom: 2px solid #0a84ff;
        }
        .list-container {
            background-color: #1c1c1e;
            border-radius: 12px;
            margin: 16px;
            overflow: hidden;
        }
        .list-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #2c2c2e;
        }
        .list-item:last-child {
            border-bottom: none;
        }
        .icon-box {
            font-size: 20px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #2c2c2e;
            border-radius: 50%;
            margin-left: 12px;
        }
        .price-col {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            min-width: 90px;
        }
        .price-val {
            font-weight: 600;
            font-size: 16px;
            direction: ltr;
        }
    </style>
</head>
<body>

    <div id="loading" class="flex h-screen items-center justify-center">
        <div class="text-center">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-[#0a84ff] mx-auto mb-3"></div>
            <p class="text-sm text-gray-400">نوێکردنەوەی نرخەکان...</p>
        </div>
    </div>

    <div id="dashboard" class="hidden pb-10">
        <div class="header-bg sticky top-0 z-10">
            <div class="flex justify-between items-center px-4 py-3">
                <div>
                    <h1 class="text-xl font-bold">KURDCHAIN TERMINAL</h1>
                    <p class="text-xs text-[#32d74b] flex items-center gap-1 mt-1">
                        <span class="relative flex h-2 w-2">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#32d74b] opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-2 w-2 bg-[#32d74b]"></span>
                        </span>
                        ڕاستەوخۆ
                    </p>
                </div>
                <div class="text-sm text-gray-400 text-left">
                    <div id="clock">--:--</div>
                    <div id="date" class="text-xs">--/--/----</div>
                </div>
            </div>

            <div class="flex px-4 mt-2">
                <button onclick="switchTab('currencies')" id="tab-currencies" class="tab-btn active flex-1 pb-2 text-sm font-medium">دراوەکان</button>
                <button onclick="switchTab('metals')" id="tab-metals" class="tab-btn flex-1 pb-2 text-sm font-medium">زێڕ و زیوو</button>
                <button onclick="switchTab('crypto')" id="tab-crypto" class="tab-btn flex-1 pb-2 text-sm font-medium">دیجیتاڵی</button>
            </div>
        </div>

        <div id="content-currencies" class="list-container"></div>
        <div id="content-metals" class="list-container hidden"></div>
        <div id="content-crypto" class="list-container hidden"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const apiUrl = "https://kurdchain-miniapp-api-production.up.railway.app";
        let currentData = {};

        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
            document.getElementById('date').innerText = now.toISOString().split('T')[0];
        }, 1000);

        window.switchTab = function(tabName) {
            ['currencies', 'metals', 'crypto'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.remove('active');
                document.getElementById(`content-${t}`).classList.add('hidden');
            });
            document.getElementById(`tab-${tabName}`).classList.add('active');
            document.getElementById(`content-${tabName}`).classList.remove('hidden');
        };

        function generateListHTML(items, sourceText = "") {
            if (!items) return '';
            let html = items.map(item => `
                <div class="list-item">
                    <div class="icon-box">${item.icon}</div>
                    <div class="flex-1 mr-3">
                        <div class="font-semibold text-[15px]">${item.name}</div>
                        <div class="text-xs text-[#8e8e93]">${item.desc}</div>
                    </div>
                    <div class="price-col justify-center">
                        <span class="price-val text-white">${item.price}</span>
                    </div>
                </div>
            `).join('');

            if (sourceText) {
                html += `<div class="p-4 text-center text-[11px] text-[#8e8e93] bg-[#151516] border-t border-[#2c2c2e] leading-5">${sourceText}</div>`;
            }
            return html;
        }

        async function fetchPrices() {
            try {
                const res = await fetch(`${apiUrl}/api/prices`);
                if (!res.ok) return;
                
                currentData = await res.json();
                
                // زیادکردنی سەرچاوەکان بۆ خوارەوەی هەر لیستێک
                document.getElementById('content-currencies').innerHTML = generateListHTML(
                    currentData.currencies, 
                    "سەرچاوە: کاک هاوکار • بازاڕی دۆلاری کۆن<br>07701570694"
                );
                document.getElementById('content-metals').innerHTML = generateListHTML(
                    currentData.metals, 
                    "سەرچاوە نرخی ڕاستەوخۆی حەوزەکە<br>کاک کاردۆ • بازاڕی دۆلاری نوێ<br>07705045485"
                );
                document.getElementById('content-crypto').innerHTML = generateListHTML(
                    currentData.crypto, 
                    "سەرچاوە: KURDCHAIN TERMINAL"
                );

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');

            } catch (error) {
                console.error("Failed to fetch prices:", error);
            }
        }

        async function initApp() {
            const user = tg.initDataUnsafe?.user;
            if (!user) {
                fetchPrices(); 
                return;
            }
            try {
                const verifyResponse = await fetch(`${apiUrl}/api/verify/${user.id}`);
                const verifyData = await verifyResponse.json();
                if (verifyData.is_vip) {
                    fetchPrices();
                    setInterval(fetchPrices, 10000); 
                } else {
                    document.body.innerHTML = `<div class="flex h-screen items-center justify-center text-center px-4"><div class="bg-[#1c1c1e] p-6 rounded-xl w-full border border-[#2c2c2e]"><h2 class="text-xl font-bold text-[#ff453a] mb-2">ڕێگەپێنەدراو</h2><p class="text-[#8e8e93] text-sm mb-4">پێویستە ئەندامی کەناڵی KurdChain بیت بۆ بینینی نرخەکان.</p><button onclick="tg.close()" class="bg-[#0a84ff] text-white w-full py-3 rounded-lg font-semibold">داخستن</button></div></div>`;
                }
            } catch(e) {
                fetchPrices();
            }
        }

        initApp();
    </script>
</body>
</html>
