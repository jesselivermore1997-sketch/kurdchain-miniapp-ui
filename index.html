<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KurdChain VIP Prices</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #1f2937);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: 'Kurdish', sans-serif;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #374151);
        }
    </style>
</head>
<body class="p-4">

    <!-- بەشی پیشاندانی لۆدینگ -->
    <div id="loading" class="text-center mt-20">
        <h2 class="text-xl font-bold">چاوەڕێ بکە...</h2>
        <p class="text-sm mt-2 text-gray-400">خەریکی سەلماندنی هەژمارەکەتین</p>
    </div>

    <!-- بەشی ڕەتکردنەوە (ئەگەر کەسەکە VIP نەبوو) -->
    <div id="access-denied" class="hidden text-center mt-20">
        <h2 class="text-2xl font-bold text-red-500">ببوورە!</h2>
        <p class="mt-4 text-lg">ئەم خزمەتگوزارییە تەنها بۆ ئەندامانی کەناڵی تایبەتی KurdChain ـە.</p>
        <button onclick="tg.close()" class="mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full">
            داخستن
        </button>
    </div>

    <!-- بەشی داشبۆردی نرخەکان (ئەگەر VIP بوو) -->
    <div id="dashboard" class="hidden">
        <h1 class="text-2xl font-bold mb-6 text-center text-yellow-400">نرخەکانی بازاڕی سلێمانی</h1>
        
        <div class="grid grid-cols-2 gap-4">
            <div class="card p-4 rounded-lg text-center shadow-lg border border-gray-600">
                <p class="text-sm text-gray-300 mb-1">١٠٠ دۆلار</p>
                <p class="text-xl font-bold text-green-400" id="price-usd">---</p>
            </div>
            
            <div class="card p-4 rounded-lg text-center shadow-lg border border-gray-600">
                <p class="text-sm text-gray-300 mb-1">١٠٠ دۆلار بە تمەن</p>
                <p class="text-xl font-bold text-blue-400" id="price-toman">---</p>
            </div>

            <div class="card p-4 rounded-lg text-center shadow-lg border border-gray-600">
                <p class="text-sm text-gray-300 mb-1">زێڕ عەیارە ٢١</p>
                <p class="text-xl font-bold text-yellow-400" id="price-gold">---</p>
            </div>

            <div class="card p-4 rounded-lg text-center shadow-lg border border-gray-600">
                <p class="text-sm text-gray-300 mb-1">١٠٠ یۆرۆ</p>
                <p class="text-xl font-bold text-white" id="price-euro">---</p>
            </div>
        </div>
        
        <p class="text-center text-xs text-gray-400 mt-8">ئەم نرخانە بە شێوەی ڕاستەوخۆ نوێ دەکرێنەوە</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const user = tg.initDataUnsafe?.user;
        const apiUrl = "https://kurdchain-miniapp-api-production.up.railway.app";

        async function checkAccessAndLoadData() {
            if (!user) {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('access-denied').classList.remove('hidden');
                return;
            }

            try {
                const verifyResponse = await fetch(`${apiUrl}/api/verify/${user.id}`);
                
                if (!verifyResponse.ok) {
                    throw new Error(`Server status: ${verifyResponse.status}`);
                }

                const verifyData = await verifyResponse.json();
                document.getElementById('loading').classList.add('hidden');

                if (verifyData.is_vip) {
                    document.getElementById('dashboard').classList.remove('hidden');
                    fetchPrices();
                    setInterval(fetchPrices, 10000); 
                } else {
                    document.getElementById('access-denied').classList.remove('hidden');
                }
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('loading').innerHTML = `<div class='mt-10'><h2 class='text-xl font-bold text-red-500'>کێشەیەک ڕوویدا</h2><p class='mt-4 text-gray-300' dir='ltr'>${error.message}</p></div>`;
            }
        }

        async function fetchPrices() {
            try {
                const res = await fetch(`${apiUrl}/api/prices`);
                if (!res.ok) return;
                const data = await res.json();
                
                document.getElementById('price-usd').innerText = data.usd_iqd.toLocaleString() + " دینار";
                document.getElementById('price-toman').innerText = data.toman.toLocaleString() + " تمەن";
                document.getElementById('price-gold').innerText = data.gold_21_mithqal.toLocaleString() + " دینار";
                document.getElementById('price-euro').innerText = data.euro.toLocaleString() + " دینار";
            } catch (error) {
                console.error("Failed to fetch prices:", error);
            }
        }

        checkAccessAndLoadData();
    </script>
</body>
</html>
